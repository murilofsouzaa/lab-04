server.port=${PORT:8080}

# Banco: H2 em arquivo localmente; em produção definir DATABASE_URL (jdbc:postgresql://...), DB_USER e DB_PASSWORD
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/moeda;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Origens permitidas para o frontend (separadas por vírgula)
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# E-mail: se MAIL_HOST ficar vazio, os e-mails são apenas registrados no log
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:nao-responda@moedaestudantil.com}
